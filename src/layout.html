<!doctype html>
<html lang="id" data-founding="{{#if founding.openAtBuild}}open{{else}}closed{{/if}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{ page.title }}</title>
  <meta name="description" content="{{ page.description }}">
  {{#if page.noindex}}<meta name="robots" content="noindex">{{else}}<link rel="canonical" href="{{ page.url }}">{{/if}}
  <meta name="theme-color" content="#0F1A33">
  <link rel="icon" href="{{ base }}assets/img/favicon.svg" type="image/svg+xml">

  <meta property="og:type" content="website">
  <meta property="og:locale" content="id_ID">
  <meta property="og:site_name" content="{{ brand }}">
  <meta property="og:title" content="{{ page.title }}">
  <meta property="og:description" content="{{ page.description }}">
  <meta property="og:url" content="{{ page.url }}">
  <meta property="og:image" content="{{ siteUrl }}{{ base }}assets/img/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="{{ brand }}: Halaman bisnismu, cukup satu link.">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="preload" href="{{ base }}assets/fonts/plus-jakarta-sans-latin-wght.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ base }}assets/css/styles.css">
  <script>
    (function (d) {
      var e = d.documentElement;
      e.classList.add("js");
      {{#if founding.enabled}}e.setAttribute("data-founding", Date.now() < {{ founding.deadlineMs }} ? "open" : "closed");{{else}}e.setAttribute("data-founding", "off");{{/if}}
    })(document);
  </script>
  <script id="site-config" type="application/json">{{{ runtimeJson }}}</script>
  <script src="{{ base }}assets/js/main.js" defer></script>
  {{#if page.isHome}}
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "{{ brand }}",
    "applicationCategory": "BusinessApplication",
    "operatingSystem": "Web, Android, iOS",
    "inLanguage": "id",
    "url": "{{ page.url }}",
    "description": "Halaman bisnis dalam satu link untuk UMKM Indonesia: katalog, link dan pesanan WhatsApp dalam satu halaman.",
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "IDR" }
  }
  </script>
  {{/if}}
</head>
<body class="page-{{ page.slug }}">
  {{> icons }}
  <a class="skip" href="#main">Langsung ke konten</a>
  {{> nav }}
  <main id="main">
{{{ body }}}
  </main>
  {{> footer }}
  <noscript><style>.reveal{opacity:1!important;transform:none!important}</style></noscript>
</body>
</html>
