<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{ page.title }}</title>
  <meta name="description" content="{{ page.description }}">
  {{#if page.noindex}}<meta name="robots" content="noindex">{{else}}<link rel="canonical" href="{{ page.url }}">{{/if}}
  <meta name="theme-color" content="{{#if page.demo}}#ffffff{{else}}#0F1A33{{/if}}">
  <link rel="icon" href="{{ base }}assets/img/favicon.svg" type="image/svg+xml">

  <meta property="og:type" content="website">
  <meta property="og:locale" content="id_ID">
  <meta property="og:site_name" content="{{ brandName }}">
  <meta property="og:title" content="{{ page.title }}">
  <meta property="og:description" content="{{ page.description }}">
  <meta property="og:url" content="{{ page.url }}">
  <meta property="og:image" content="{{ siteUrl }}{{ base }}assets/img/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="{{ brandName }}: Halaman bisnismu di internet, cukup satu link.">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="preload" href="{{ base }}assets/fonts/plus-jakarta-sans-latin-wght.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ base }}assets/css/styles.css">
  {{#if page.demo}}<link rel="stylesheet" href="{{ base }}assets/css/demo.css">{{/if}}
  <script>
    (function (d) {
      d.classList.add("js");
      {{#if page.demo}}var p = ""; try { p = new URLSearchParams(location.search).get("paket") || ""; } catch (e) {}
      d.setAttribute("data-plan", p === "pro" ? "pro" : "free");{{/if}}
    })(document.documentElement);
  </script>
  <script id="site-config" type="application/json">{{{ runtimeJson }}}</script>
  <script src="{{ base }}assets/js/site.js" defer></script>
  {{#if page.demo}}
  <script id="demo-data" type="application/json">{{{ demoJson }}}</script>
  <script src="{{ base }}assets/js/demo.js" defer></script>
  {{/if}}
</head>
<body class="page-{{ page.slug }}{{#if page.demo}} is-demo{{/if}}">
  {{> icons }}
{{#if page.demo}}
{{{ body }}}
{{else}}
  <a class="skip" href="#main">Langsung ke konten</a>
  {{> header }}
  <main id="main">
{{{ body }}}
  </main>
  {{> footer }}
{{/if}}
  {{> sheet }}
  <div class="toast" role="status" aria-live="polite" data-toast hidden></div>
</body>
</html>
