---
{
  "title": "Halaman tidak ditemukan · {{ brandName }}",
  "description": "Halaman yang kamu cari tidak ada.",
  "noindex": true
}
---
    <section class="notfound">
      <div class="wrap center">
        <p class="notfound__code">404</p>
        <h1 class="h2">Halaman ini tidak ditemukan</h1>
        <p class="lede">Mungkin link-nya salah ketik, atau halamannya sudah dipindah.</p>
        <div class="btn-row">
          <a class="btn btn--accent btn--lg" href="{{ base }}">Ke beranda</a>
          <a class="btn btn--outline btn--lg" href="{{ base }}contoh/kueburina/">Lihat contoh halaman</a>
        </div>
      </div>
    </section>
