<header class="header" data-header>
  <div class="wrap header__inner">
    <a class="brand" href="{{ home }}" aria-label="{{ t.homeLabel }}">
      <svg class="brand__mark" aria-hidden="true"><use href="#i-logo"/></svg>
      <span>{{ brandName }}</span>
    </a>
    <nav class="header__links" aria-label="{{ t.nav.label }}">
      <a href="{{#unless page.isHome}}{{ home }}{{/unless}}#cara-kerja">{{ t.nav.how }}</a>
      <a href="{{ home }}contoh/warungsari/">{{ t.nav.example }}</a>
      <a href="{{#unless page.isHome}}{{ home }}{{/unless}}#pro">{{ t.nav.pro }}</a>
      <a href="{{#unless page.isHome}}{{ home }}{{/unless}}#harga">{{ t.nav.pricing }}</a>
      <a href="{{#unless page.isHome}}{{ home }}{{/unless}}#faq">{{ t.nav.faq }}</a>
    </nav>
    <div class="header__actions">
      {{!-- D-70: this site cannot see the app's session, so it always shows "Masuk". --}}
      <a class="header__login" href="{{ app.login }}" data-app-link>{{ t.signIn }}</a>
      <a class="btn btn--accent btn--sm header__cta" href="{{ app.register }}" data-app-link>{{ t.ctaStart }}</a>
      {{> lang-switch }}
    </div>
  </div>
</header>
