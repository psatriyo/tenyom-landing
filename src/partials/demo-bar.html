<div class="demo-bar">
  <a class="demo-bar__home" href="{{ home }}" aria-label="{{ t.demoBar.homeLabel }}"><svg aria-hidden="true"><use href="#i-back"/></svg></a>
  <p class="demo-bar__text">{{{ page.demoLabel }}}</p>
  {{> lang-switch }}
  <div class="plan-switch" role="group" aria-label="{{ t.demoBar.plansLabel }}">
    <button type="button" data-plan-set="free" aria-pressed="true">{{ t.demoBar.free }}</button>
    <button type="button" data-plan-set="pro" aria-pressed="false">{{ t.demoBar.pro }}</button>
  </div>
</div>
